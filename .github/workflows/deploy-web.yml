name: Deploy Web to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Web export
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Export Web preset
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Web
          use_preset_export_path: true
          verbose: true

      - name: Stage and verify Pages site
        shell: bash
        run: |
          set -euo pipefail

          source_dir="build/web/Web"
          pages_dir="build/pages"

          echo "Raw Godot export:"
          if [[ -d build/web ]]; then
            find build/web -maxdepth 3 -type f -printf '%P\n' | sort
          else
            echo "::error::The Godot export directory build/web does not exist"
            exit 1
          fi

          if [[ ! -d "$source_dir" ]]; then
            echo "::error::Expected Godot Web output directory $source_dir"
            exit 1
          fi

          if [[ ! -f "$source_dir/index.html" ]]; then
            echo "::error::Missing $source_dir/index.html"
            exit 1
          fi

          if ! find "$source_dir" -maxdepth 1 -type f -name '*.wasm' \
              -print -quit | grep -q .; then
            echo "::error::Godot Web export contains no .wasm file"
            exit 1
          fi

          if ! find "$source_dir" -maxdepth 1 -type f -name '*.pck' \
              -print -quit | grep -q .; then
            echo "::error::Godot Web export contains no .pck file"
            exit 1
          fi

          rm -rf "$pages_dir"
          mkdir -p "$pages_dir"
          cp -a "$source_dir"/. "$pages_dir"/
          touch "$pages_dir/.nojekyll"

          echo "Staged GitHub Pages site:"
          find "$pages_dir" -maxdepth 2 -type f -printf '%P\n' | sort

          if [[ ! -f "$pages_dir/index.html" ]]; then
            echo "::error::Staged Pages artifact has no root index.html"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
